services:
  redis:
    image: redis:7-alpine
    container_name: cinehanks-redis
    restart: unless-stopped

  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    container_name: cinehanks-log-service
    expose:
      - "3335"
    environment:
      PORT: 3335
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3334
    depends_on:
      - redis
      - auth-service
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cinehanks-nginx
    ports:
      - "8209:80"
    depends_on:
      - frontend
      - backend
      - auth-service
      - log-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cinehanks-auth-service
    expose:
      - "3334"
    environment:
      PORT: 3334
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN}
      MAILTRAP_SENDER_EMAIL: ${MAILTRAP_SENDER_EMAIL}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinehanks-backend
    expose:
      - "3333"
    environment:
      PORT: 3333
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3334
      REDIS_URL: redis://redis:6379
    depends_on:
      - auth-service
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinehanks-frontend
    expose:
      - "5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_TMDB_API_KEY: ${VITE_TMDB_API_KEY}
    depends_on:
      - backend
    restart: unless-stopped

