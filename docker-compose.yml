services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinehanks-backend
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3333
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinehanks-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
