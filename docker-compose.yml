services:
  nginx:
    image: nginx:alpine
    container_name: cinehanks-nginx
    ports:
      - "8209:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinehanks-backend
    expose:
      - "3333"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3333
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinehanks-frontend
    expose:
      - "5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
